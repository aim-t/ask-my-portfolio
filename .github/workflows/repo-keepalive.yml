name: Repo keep-alive

# GitHub auto-disables ALL scheduled workflows in a repository (not just
# one) after 60 days with zero commits. This makes a trivial empty
# commit once a month, well under that threshold, so the
# keep-backend-awake workflow (and any other scheduled workflow added
# here later) never actually hits the disablement condition in the
# first place - nobody has to notice and manually re-enable anything.
on:
  schedule:
    - cron: "17 4 1 * *" # 04:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make an empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keep-alive commit (prevents scheduled workflows from being auto-disabled)"
          git push
